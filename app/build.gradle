plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ucuzakapat.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ucuzakapat.app'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
